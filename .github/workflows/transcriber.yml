name: Transcription service
# Independent of the desktop app workflow: only transcriber-v* tags build and release the service,
# and the app's v* tags never trigger this workflow. See ADR-0001.
on:
  workflow_dispatch:
  push:
    tags: ['transcriber-v*']
permissions:
  contents: read
env:
  MODEL_REPO: OpenMOSS-Team/MOSS-Transcribe-Diarize
  MODEL_REVISION: e8681d68e7042738ffca8ac8212bc8fcb1131ab8
  # Static LGPL ffmpeg; its SHA-256 must be reviewed and set as a repository variable.
  FFMPEG_URL: ${{ vars.TRANSCRIBER_FFMPEG_URL }}
  FFMPEG_SHA256: ${{ vars.TRANSCRIBER_FFMPEG_SHA256 }}
jobs:
  windows-cuda:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r transcriber/requirements.txt --extra-index-url https://download.pytorch.org/whl/cu128
      - run: python -m pip install pyinstaller==6.19.0 pyinstaller-hooks-contrib==2026.7 PyNaCl==1.6.2
      - run: python -m unittest tests.test_transcriber_segments tests.test_transcriber_server -v
      - name: Fetch pinned LGPL ffmpeg
        shell: pwsh
        run: |
          if (-not $env:FFMPEG_URL -or -not $env:FFMPEG_SHA256) { throw "Set TRANSCRIBER_FFMPEG_URL and TRANSCRIBER_FFMPEG_SHA256 repository variables" }
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256.ToUpper()) { throw "ffmpeg archive hash mismatch" }
          Expand-Archive ffmpeg.zip ffmpeg
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "SUBTITLEFLOW_FFMPEG_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
      - run: python -m PyInstaller --noconfirm transcriber.spec
      - run: python tools/verify_transcriber.py dist/SubtitleFlow-Transcriber/SubtitleFlow-Transcriber.exe
      - name: Download pinned model for hashing (not uploaded)
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('${{ env.MODEL_REPO }}', revision='${{ env.MODEL_REVISION }}', local_dir='model'))"
      - name: Split and sign
        env:
          SUBTITLEFLOW_UPDATE_SIGNING_KEY: ${{ secrets.SUBTITLEFLOW_UPDATE_SIGNING_KEY }}
          SUBTITLEFLOW_UPDATE_KEY_ID: ${{ vars.SUBTITLEFLOW_UPDATE_KEY_ID }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#transcriber-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION=0.0.0
          python tools/transcriber_release.py --version "$VERSION" --dist dist/SubtitleFlow-Transcriber \
            --model-dir model --model-revision "$MODEL_REVISION" --output release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SubtitleFlow-Transcriber-windows-x86_64
          path: release-assets/
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/transcriber-v')
    needs: windows-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SubtitleFlow-Transcriber-windows-x86_64
          path: release-assets
      - name: Create draft release with split service package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # --latest=false: the app's update check reads releases/latest and must only ever see app (v*) releases.
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --latest=false --title "SubtitleFlow 转录服务 $GITHUB_REF_NAME" \
            --notes "Transcription service parts. Review licenses and upload a locally signed transcriber.json before publishing. Never mark this release as latest."
          gh release upload "$GITHUB_REF_NAME" release-assets/*
